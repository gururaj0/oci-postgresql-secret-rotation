[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-postgresql-secret-rotation"
version = "0.1.0"
description = "Customer-operated OCI Vault and PostgreSQL credential rotation"
requires-python = ">=3.11"
dependencies = ["oci==2.188.0", "psycopg[binary]==3.2.12", "PyYAML==6.0.3", "fdk==0.1.103"]

[project.scripts]
pg-vault-rotation = "cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
